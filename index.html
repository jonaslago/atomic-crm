    />

    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="40x40" href="./appIcon/40.png" />
    <link rel="apple-touch-icon" sizes="58x58" href="./appIcon/58.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="./appIcon/60.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="./appIcon/76.png" />
    <link rel="apple-touch-icon" sizes="80x80" href="./appIcon/80.png" />
    <link rel="apple-touch-icon" sizes="87x87" href="./appIcon/87.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="./appIcon/114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="./appIcon/120.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="./appIcon/128.png" />
    <link rel="apple-touch-icon" sizes="136x136" href="./appIcon/136.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./appIcon/152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./appIcon/167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./appIcon/180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./appIcon/192.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="./appIcon/1024.png" />
    <title>LAGO CRM</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      /* Prevent accidental double-tap zoom on interactive elements */
      button,
      input,
      select,
      textarea,
      a {
        touch-action: manipulation;
      }

      .loader-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: #F7F7F6;
      }

      /* CSS Spinner from https://projects.lukehaas.me/css-loaders/ */

      .loader,
      .loader:before,
      .loader:after {
        border-radius: 50%;
      }

      /* LAGO tokens duplikeret her fordi loaderen tegnes før bundle-CSS
       * er loaded — custom properties fra tokens.css er endnu ikke i
       * scope. Værdier: color=--a (accent), background=--canvas.
       * Hold synkroniseret med src/lago/theme/tokens.css. */
      .loader {
        color: #00A99B;
        font-size: 11px;
        text-indent: -99999em;
        margin: 55px auto;
        position: relative;
        width: 10em;
        height: 10em;
        box-shadow: inset 0 0 0 1em;
        -webkit-transform: translateZ(0);
        -ms-transform: translateZ(0);
        transform: translateZ(0);
      }

      .loader:before,
      .loader:after {
        position: absolute;
        content: "";
      }

      .loader:before {
        width: 5.2em;
        height: 10.2em;
        background: #F7F7F6;
        border-radius: 10.2em 0 0 10.2em;
        top: -0.1em;
        left: -0.1em;
        -webkit-transform-origin: 5.2em 5.1em;
        transform-origin: 5.2em 5.1em;
        -webkit-animation: load2 2s infinite ease 1.5s;
        animation: load2 2s infinite ease 1.5s;
      }

      .loader:after {
        width: 5.2em;
        height: 10.2em;
        background: #F7F7F6;
        border-radius: 0 10.2em 10.2em 0;
        top: -0.1em;
        left: 5.1em;
        -webkit-transform-origin: 0px 5.1em;
        transform-origin: 0px 5.1em;
        -webkit-animation: load2 2s infinite ease;
        animation: load2 2s infinite ease;
      }

      @-webkit-keyframes load2 {
        0% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      @keyframes load2 {
        0% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader-container">
        <div class="loader">Loading...</div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      // Supabase auth-callback interceptor (LAGO Brief 42-korrektur ·
      // 16. sep 2026).
      //
      // Mail-links (recovery / magic-link) redirecter til site_url med
      // tokens i URL-hash (#access_token=… eller #error=…). React
      // HashRouter genkender ikke rå hash-tokens som en route, så vi
      // omdirigerer selv til set-password / login før React monterer.
      //
      // Tre regler at holde adskilt fra hinanden — tidligere version
      // brød reglerne, hvilket sendte gyldige set-password-links til
      // login på kold start:
      //
      //   1) Rå tokens i hash (#access_token=X&refresh_token=Y&type=Z)
      //      → redirect til #/set-password?access_token=X&…
      //
      //   2) Rå fejl i hash (#error=access_denied&error_description=…
      //      typisk fra udløbet link) → redirect til #/login med
      //      error-teksten som search-param så login-siden kan vise den.
      //
      //   3) Hash-route med query-hale (#/set-password?access_token=X
      //      eller andre routes med ?params) → LAD DEN VÆRE. React-
      //      routeren håndterer den, og useSupabaseAccessToken læser
      //      tokens fra hash-query. En interceptor der kaprer alt med
      //      "access_token=" i hash sendte gyldige set-password-URLs
      //      tilbage til den (ikke-eksisterende) auth-callback-rute.
      (function () {
        var raw = window.location.hash.substring(1);
        // Regel 3: hash-routes starter altid med "/". Kaprer aldrig dem.
        if (raw.length === 0 || raw.charAt(0) === "/") return;
        var params = new URLSearchParams(raw);
        var target = null;
        if (params.get("access_token")) {
          target = "#/set-password?" + params.toString();
        } else if (params.get("error") || params.get("error_description")) {
          target = "#/login?" + params.toString();
        }
        if (target) {
          window.location.replace(window.location.pathname + target);
        }
      })();
    </script>
    <script type="module" src="<%= mainScript %>"></script>
  </body>
</html>
