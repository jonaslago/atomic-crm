      // 16. sep 2026).
      //
      // Mail-links (recovery / magic-link) redirecter til site_url med
      // tokens i URL-hash (#access_token=… eller #error=…). React
      // HashRouter genkender ikke rå hash-tokens som en route, så vi

      //
      // Tre regler at holde adskilt fra hinanden — tidligere version

      //
      //   1) Rå tokens i hash (#access_token=X&refresh_token=Y&type=Z)
      //      → redirect til #/set-password?access_token=X&…

      //   2) Rå fejl i hash (#error=access_denied&error_description=…

      //      error-teksten som search-param så login-siden kan vise den.
      //
      //   3) Hash-route med query-hale (#/set-password?access_token=X
      //      eller andre routes med ?params) → LAD DEN VÆRE. React-
      //      routeren håndterer den, og useSupabaseAccessToken læser
      //      tokens fra hash-query. En interceptor der kaprer alt med
      //      "access_token=" i hash sendte gyldige set-password-URLs
      //      tilbage til den (ikke-eksisterende) auth-callback-rute.
      (function () {
        var raw = window.location.hash.substring(1);
        // Regel 3: hash-routes starter altid med "/". Kaprer aldrig dem.
        if (raw.length === 0 || raw.charAt(0) === "/") return;
        var params = new URLSearchParams(raw);
        var target = null;
        if (params.get("access_token")) {
          target = "#/set-password?" + params.toString();
